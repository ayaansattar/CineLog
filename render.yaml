# Render Blueprint — free web service + Neon Postgres (no persistent disk).
# When creating the Blueprint, paste DATABASE_URL / API keys when prompted (sync: false).

services:
  - type: web
    name: cinelog
    runtime: node
    plan: free
    region: oregon
    # --include=dev: Vite/Tailwind live in devDependencies; Render would skip them if NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
